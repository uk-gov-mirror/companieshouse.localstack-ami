- name: Create .m2 directory for ec2-user
  ansible.builtin.file:
    path: /home/ec2-user/.m2
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'

- name: Copy Maven settings.xml
  ansible.builtin.copy:
    src: settings.xml
    dest: /home/ec2-user/.m2/settings.xml
    owner: ec2-user
    group: ec2-user
    mode: '0600'
